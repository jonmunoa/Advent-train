<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi maqueta de Navidad</title>
<meta name="description" content="Monta tu maqueta de Navidad bajo el árbol: el tren reparte regalos solo y tú compras casas, vagones, luces y más vía.">
<meta name="theme-color" content="#0b1530">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Yesteryear&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/idle.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="coinS" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.5" fill="#a8771f"/><circle cx="16" cy="15" r="14" fill="#e0ad45"/><circle cx="16" cy="15" r="10.2" fill="none" stroke="#a8771f" stroke-width="1.6"/><path d="M16 8.6l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="#fff3c4"/></symbol>
</svg>
<canvas id="c" aria-label="Maqueta de Navidad en 3D: arrastra para girarla y pellizca o usa la rueda para acercarte"></canvas>

<header class="top">
  <div class="bank">
    <div class="brand">Mi maqueta <span>de Navidad</span></div>
    <div class="row"><svg class="coin" viewBox="0 0 32 32" aria-hidden="true"><use href="#coinS"/></svg><b id="coins" class="mono" aria-live="off">0</b></div>
    <div id="rate" class="rate mono">+0 / s</div>
  </div>
  <div class="tools">
    <button class="tb" id="bCam" aria-pressed="false" aria-label="Seguir al tren" title="Seguir al tren (C)"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="tb" id="bMusic" aria-label="Música"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="of" d="M3 3l18 18"/></svg></button>
    <button class="tb" id="bSfx" aria-label="Sonido"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/><path class="of" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </div>
</header>
<p id="tip" class="tip hide" role="status"></p>
<div id="floats" aria-hidden="true"></div>

<button id="boost" class="boost" aria-label="Silbato: el tren corre más durante unos segundos" title="Silbato (Espacio)">
  <svg class="ring" viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="33" stroke-dasharray="207.3" stroke-dashoffset="0"/></svg>
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5h9.5a4.5 4.5 0 1 1-4.3 5.8L3 14.5z"/><circle cx="12.6" cy="15" r="1.4"/><path d="M14.5 6.5l1.5-2.5M18 8l2.5-1.5M10.8 6.2 10.3 3.4"/></svg>
  <span class="lbl">Silbato</span>
</button>

<nav id="shop" class="shop" aria-label="Tienda"></nav>

<div id="away" class="modal" role="dialog" aria-modal="true" aria-labelledby="awTtl">
  <div class="card">
    <h2 id="awTtl">Mientras no estabas</h2>
    <p class="when" id="awTime"></p>
    <div class="big mono"><svg class="coin" viewBox="0 0 32 32" aria-hidden="true"><use href="#coinS"/></svg><span id="awCoins">+0</span></div>
    <p id="awGifts"></p>
    <button class="btn" id="awOk">Recoger</button>
  </div>
</div>

<div id="load" class="load" aria-live="polite">
  <div class="lin">
    <div class="ttl">Mi maqueta</div><div class="sub">de Navidad</div>
    <div class="bar"><i id="lBar"></i></div>
    <p id="lTxt">Cargando…</p>
  </div>
</div>
<div id="err" class="err" role="alert"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script>window.__boot=setTimeout(()=>{const e=document.getElementById('err');e.textContent='No se ha podido cargar el motor 3D. Revisa la conexión y recarga la página.';e.style.display='block'},20000);</script>
<script type="module" src="src/idle.js"></script>
</body>
</html>
